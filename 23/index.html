<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分子动力学模拟 - Lennard-Jones 势能</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            min-width: 280px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }
        #panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #60a5fa;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            padding-bottom: 10px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 14px;
        }
        .stat-value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            color: #34d399;
        }
        .panel-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .panel-btn:hover {
            transform: translateY(-1px);
        }
        .panel-btn:active {
            transform: translateY(0);
        }
        #apply-force-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        #apply-force-btn:hover {
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        #record-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        #record-btn:hover {
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        #record-btn.recording {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #view-traj-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            display: none;
        }
        #view-traj-btn:hover {
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }
        .slider-section {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .slider-header span:first-child {
            color: #94a3b8;
            font-size: 14px;
        }
        .slider-value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            color: #60a5fa;
        }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(100, 150, 255, 0.3);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #60a5fa;
            border-radius: 50%;
            cursor: pointer;
        }
        #connection-status {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .connected {
            background: rgba(34, 197, 94, 0.9);
            color: white;
        }
        .disconnected {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }
        #particle-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            display: none;
            z-index: 100;
        }
        #particle-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #f472b6;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            padding: 12px 16px;
            color: #94a3b8;
            font-size: 12px;
            z-index: 100;
        }
        #chart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        #chart-modal.active {
            display: flex;
        }
        #chart-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 24px;
            width: 750px;
            max-height: 85vh;
            overflow-y: auto;
        }
        #chart-container h2 {
            color: #60a5fa;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .chart-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .chart-controls label {
            color: #94a3b8;
            font-size: 14px;
        }
        .chart-controls select {
            background: rgba(30, 41, 59, 0.9);
            color: white;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            outline: none;
        }
        #close-chart-btn {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-left: auto;
        }
        #close-chart-btn:hover {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
        }
        #traj-chart {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="connection-status" class="disconnected">连接中...</div>
    
    <div id="panel">
        <h2>系统状态</h2>
        <div class="stat-item">
            <span class="stat-label">总动能</span>
            <span class="stat-value" id="kinetic-energy">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">势能</span>
            <span class="stat-value" id="potential-energy">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">温度</span>
            <span class="stat-value" id="temperature">--</span>
        </div>
        <div class="slider-section">
            <div class="slider-header">
                <span>显示粒子数</span>
                <span class="slider-value" id="particle-count-label">200</span>
            </div>
            <input type="range" id="particle-count-slider" min="50" max="200" value="200" step="10">
        </div>
        <button class="panel-btn" id="apply-force-btn">施加随机外力</button>
        <button class="panel-btn" id="record-btn">录制轨迹 (5秒)</button>
        <button class="panel-btn" id="view-traj-btn">查看轨迹图表</button>
    </div>
    
    <div id="particle-info">
        <h3>选中粒子信息</h3>
        <div class="stat-item">
            <span class="stat-label">粒子编号</span>
            <span class="stat-value" id="particle-id">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">速度 Vx</span>
            <span class="stat-value" id="velocity-x">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">速度 Vy</span>
            <span class="stat-value" id="velocity-y">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">速度 Vz</span>
            <span class="stat-value" id="velocity-z">--</span>
        </div>
    </div>
    
    <div id="instructions">
        左键拖拽旋转 | 滚轮缩放 | 点击粒子查看速度
    </div>
    
    <div id="chart-modal">
        <div id="chart-container">
            <h2>粒子轨迹 - 位置时间曲线</h2>
            <div class="chart-controls">
                <label>选择粒子:</label>
                <select id="traj-particle-select"></select>
                <button id="close-chart-btn">关闭</button>
            </div>
            <canvas id="traj-chart"></canvas>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        THREE.OrbitControls = function ( object, domElement ) {
            this.object = object;
            this.domElement = domElement;
            this.target = new THREE.Vector3();
            this.enabled = true;
            this.enableDamping = false;
            this.dampingFactor = 0.05;
            this.enableZoom = true;
            this.minDistance = 0;
            this.maxDistance = Infinity;
            this.enableRotate = true;
            this.rotateSpeed = 1.0;
            this.zoomSpeed = 1.0;
            var scope = this;
            var spherical = new THREE.Spherical();
            var sphericalDelta = new THREE.Spherical();
            var scale = 1;
            var rotateStart = new THREE.Vector2();
            var rotateEnd = new THREE.Vector2();
            var rotateDelta = new THREE.Vector2();
            var zoomStart = new THREE.Vector2();
            var zoomEnd = new THREE.Vector2();
            var zoomDelta = new THREE.Vector2();
            var position = new THREE.Vector3();
            function handleRotateStart( event ) {
                rotateStart.set( event.clientX, event.clientY );
            }
            function handleRotateMove( event ) {
                rotateEnd.set( event.clientX, event.clientY );
                rotateDelta.subVectors( rotateEnd, rotateStart ).multiplyScalar( scope.rotateSpeed );
                var element = scope.domElement;
                sphericalDelta.theta -= 2 * Math.PI * rotateDelta.x / element.clientHeight;
                sphericalDelta.phi -= 2 * Math.PI * rotateDelta.y / element.clientHeight;
                rotateStart.copy( rotateEnd );
            }
            function handleMouseDown( event ) {
                if ( scope.enabled === false ) return;
                switch ( event.button ) {
                    case 0:
                        if ( scope.enableRotate === false ) return;
                        handleRotateStart( event );
                        scope.domElement.addEventListener( 'mousemove', handleMouseMove, false );
                        scope.domElement.addEventListener( 'mouseup', handleMouseUp, false );
                        break;
                }
            }
            function handleMouseMove( event ) {
                if ( scope.enabled === false ) return;
                if ( scope.enableRotate === false ) return;
                handleRotateMove( event );
            }
            function handleMouseUp() {
                scope.domElement.removeEventListener( 'mousemove', handleMouseMove, false );
                scope.domElement.removeEventListener( 'mouseup', handleMouseUp, false );
            }
            function handleMouseWheel( event ) {
                if ( scope.enabled === false || scope.enableZoom === false ) return;
                event.preventDefault();
                if ( event.deltaY < 0 ) {
                    scale *= Math.pow( 0.95, scope.zoomSpeed );
                } else if ( event.deltaY > 0 ) {
                    scale /= Math.pow( 0.95, scope.zoomSpeed );
                }
            }
            this.update = function () {
                position.copy( scope.object.position ).sub( scope.target );
                spherical.setFromVector3( position );
                spherical.theta += sphericalDelta.theta;
                spherical.phi += sphericalDelta.phi;
                spherical.phi = Math.max( 0.1, Math.min( Math.PI - 0.1, spherical.phi ) );
                spherical.radius *= scale;
                spherical.radius = Math.max( scope.minDistance, Math.min( scope.maxDistance, spherical.radius ) );
                if ( scope.enableDamping === true ) {
                    sphericalDelta.theta *= ( 1 - scope.dampingFactor );
                    sphericalDelta.phi *= ( 1 - scope.dampingFactor );
                } else {
                    sphericalDelta.set( 0, 0, 0 );
                }
                scale = 1;
                position.setFromSpherical( spherical );
                scope.object.position.copy( scope.target ).add( position );
                scope.object.lookAt( scope.target );
                return false;
            };
            scope.domElement.addEventListener( 'contextmenu', function ( event ) { event.preventDefault(); }, false );
            scope.domElement.addEventListener( 'mousedown', handleMouseDown, false );
            scope.domElement.addEventListener( 'wheel', handleMouseWheel, false );
        };
    </script>
    <script>
        const BOX_SIZE = 10;
        const NUM_PARTICLES = 200;
        
        let scene, camera, renderer, controls;
        let particles, glowPoints, selectedMarker;
        let particlePositions, glowPositions;
        let boxMesh;
        let selectedParticle = -1;
        let velocityArrow;
        let ws;
        let currentVelocities = new Float32Array(NUM_PARTICLES * 3);
        let currentPositions = new Float32Array(NUM_PARTICLES * 3);
        
        let displayCount = 200;
        let displaySet = new Set();
        function computeDisplayIndices() {
            displaySet = new Set();
            if (displayCount >= NUM_PARTICLES) {
                for (let i = 0; i < NUM_PARTICLES; i++) displaySet.add(i);
            } else {
                const step = NUM_PARTICLES / displayCount;
                for (let i = 0; i < displayCount; i++) {
                    displaySet.add(Math.floor(i * step));
                }
            }
        }
        computeDisplayIndices();
        
        let isRecording = false;
        let recordStartTime = 0;
        const RECORD_DURATION = 5000;
        const RECORD_SAMPLE_INTERVAL = 100;
        let lastRecordSampleTime = 0;
        let recordedData = [];
        let trajectoryChart = null;
        
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x1a1a2e, 15, 50);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 12, 15);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 40;
            
            createBox();
            createParticles();
            createVelocityArrow();
            addLights();
            
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onParticleClick);
            
            connectWebSocket();
            animate();
        }
        
        function createBox() {
            const geometry = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
            const edges = new THREE.EdgesGeometry(geometry);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x60a5fa, 
                transparent: true, 
                opacity: 0.5 
            });
            boxMesh = new THREE.LineSegments(edges, material);
            scene.add(boxMesh);
            
            const innerGeometry = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
            const innerMaterial = new THREE.MeshBasicMaterial({
                color: 0x1e3a5f,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide
            });
            const innerBox = new THREE.Mesh(innerGeometry, innerMaterial);
            scene.add(innerBox);
        }
        
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(52, 211, 153, 1)');
            gradient.addColorStop(0.6, 'rgba(52, 211, 153, 0.5)');
            gradient.addColorStop(1, 'rgba(52, 211, 153, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(52, 211, 153, 0.6)');
            gradient.addColorStop(0.3, 'rgba(52, 211, 153, 0.3)');
            gradient.addColorStop(0.6, 'rgba(52, 211, 153, 0.1)');
            gradient.addColorStop(1, 'rgba(52, 211, 153, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        
        function createParticles() {
            particlePositions = new Float32Array(NUM_PARTICLES * 3);
            glowPositions = new Float32Array(NUM_PARTICLES * 3);
            
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const ix = i * 3;
                particlePositions[ix] = (Math.random() - 0.5) * BOX_SIZE;
                particlePositions[ix + 1] = (Math.random() - 0.5) * BOX_SIZE;
                particlePositions[ix + 2] = (Math.random() - 0.5) * BOX_SIZE;
                glowPositions[ix] = particlePositions[ix];
                glowPositions[ix + 1] = particlePositions[ix + 1];
                glowPositions[ix + 2] = particlePositions[ix + 2];
            }
            
            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.5,
                map: createParticleTexture(),
                vertexColors: false,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
            
            const glowGeometry = new THREE.BufferGeometry();
            glowGeometry.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
            
            const glowMaterial = new THREE.PointsMaterial({
                size: 1.5,
                map: createGlowTexture(),
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            glowPoints = new THREE.Points(glowGeometry, glowMaterial);
            scene.add(glowPoints);
            
            const markerGeometry = new THREE.SphereGeometry(0.35, 16, 16);
            const markerMaterial = new THREE.MeshPhongMaterial({
                color: 0xf472b6,
                emissive: 0xec4899,
                emissiveIntensity: 0.8
            });
            selectedMarker = new THREE.Mesh(markerGeometry, markerMaterial);
            selectedMarker.visible = false;
            scene.add(selectedMarker);
        }
        
        function createVelocityArrow() {
            const dir = new THREE.Vector3(1, 0, 0);
            const origin = new THREE.Vector3(0, 0, 0);
            velocityArrow = new THREE.ArrowHelper(dir, origin, 1, 0xf472b6, 0.3, 0.15);
            velocityArrow.visible = false;
            scene.add(velocityArrow);
        }
        
        function addLights() {
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);
            
            const pointLight1 = new THREE.PointLight(0x60a5fa, 1, 50);
            pointLight1.position.set(15, 15, 15);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xf472b6, 0.5, 50);
            pointLight2.position.set(-15, -10, -15);
            scene.add(pointLight2);
        }
        
        function connectWebSocket() {
            const statusEl = document.getElementById('connection-status');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                statusEl.textContent = '已连接';
                statusEl.className = 'connected';
            };
            
            ws.onclose = () => {
                statusEl.textContent = '已断开';
                statusEl.className = 'disconnected';
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = () => {
                statusEl.textContent = '连接错误';
                statusEl.className = 'disconnected';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateParticles(data);
                updateStats(data);
                handleRecording(data);
            };
        }
        
        function updateParticles(data) {
            const positions = data.positions;
            currentVelocities = new Float32Array(data.velocities);
            
            const particlePosAttr = particles.geometry.attributes.position;
            const glowPosAttr = glowPoints.geometry.attributes.position;
            const particlePosArray = particlePosAttr.array;
            const glowPosArray = glowPosAttr.array;
            
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const ix = i * 3;
                const x = positions[ix] - BOX_SIZE / 2;
                const y = positions[ix + 1] - BOX_SIZE / 2;
                const z = positions[ix + 2] - BOX_SIZE / 2;
                
                currentPositions[ix] = x;
                currentPositions[ix + 1] = y;
                currentPositions[ix + 2] = z;
                
                if (displaySet.has(i)) {
                    particlePosArray[ix] = x;
                    particlePosArray[ix + 1] = y;
                    particlePosArray[ix + 2] = z;
                    glowPosArray[ix] = x;
                    glowPosArray[ix + 1] = y;
                    glowPosArray[ix + 2] = z;
                } else {
                    particlePosArray[ix] = NaN;
                    particlePosArray[ix + 1] = NaN;
                    particlePosArray[ix + 2] = NaN;
                    glowPosArray[ix] = NaN;
                    glowPosArray[ix + 1] = NaN;
                    glowPosArray[ix + 2] = NaN;
                }
            }
            
            particlePosAttr.needsUpdate = true;
            glowPosAttr.needsUpdate = true;
            
            if (selectedParticle >= 0) {
                updateVelocityArrow(selectedParticle);
            }
        }
        
        function updateStats(data) {
            document.getElementById('kinetic-energy').textContent = data.kinetic_energy.toFixed(2);
            document.getElementById('potential-energy').textContent = data.potential_energy.toFixed(2);
            document.getElementById('temperature').textContent = data.temperature.toFixed(2);
        }
        
        function handleRecording(data) {
            if (!isRecording) return;
            
            const now = performance.now();
            const elapsed = now - recordStartTime;
            
            if (elapsed >= RECORD_DURATION) {
                stopRecording();
                return;
            }
            
            if (now - lastRecordSampleTime >= RECORD_SAMPLE_INTERVAL) {
                lastRecordSampleTime = now;
                const sampleTime = (now - recordStartTime) / 1000;
                
                const sample = {
                    time: sampleTime,
                    positions: new Float32Array(currentPositions)
                };
                recordedData.push(sample);
            }
        }
        
        function startRecording() {
            isRecording = true;
            recordStartTime = performance.now();
            lastRecordSampleTime = 0;
            recordedData = [];
            
            const btn = document.getElementById('record-btn');
            btn.textContent = '录制中...';
            btn.classList.add('recording');
            document.getElementById('view-traj-btn').style.display = 'none';
        }
        
        function stopRecording() {
            isRecording = false;
            
            const btn = document.getElementById('record-btn');
            btn.textContent = '录制轨迹 (5秒)';
            btn.classList.remove('recording');
            
            if (recordedData.length > 0) {
                document.getElementById('view-traj-btn').style.display = 'block';
            }
        }
        
        function openTrajectoryChart() {
            if (recordedData.length === 0) return;
            
            const modal = document.getElementById('chart-modal');
            modal.classList.add('active');
            
            const select = document.getElementById('traj-particle-select');
            select.innerHTML = '';
            
            for (let i = 0; i < NUM_PARTICLES; i++) {
                if (displaySet.has(i)) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = '粒子 ' + i;
                    select.appendChild(opt);
                }
            }
            
            if (selectedParticle >= 0) {
                select.value = selectedParticle;
            }
            
            renderChart(parseInt(select.value));
        }
        
        function renderChart(particleIdx) {
            const ctx = document.getElementById('traj-chart').getContext('2d');
            
            if (trajectoryChart) {
                trajectoryChart.destroy();
            }
            
            const times = [];
            const xVals = [];
            const yVals = [];
            const zVals = [];
            
            for (let s = 0; s < recordedData.length; s++) {
                const sample = recordedData[s];
                times.push(sample.time.toFixed(2));
                const ix = particleIdx * 3;
                xVals.push(sample.positions[ix]);
                yVals.push(sample.positions[ix + 1]);
                zVals.push(sample.positions[ix + 2]);
            }
            
            trajectoryChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times,
                    datasets: [
                        {
                            label: 'X 位置',
                            data: xVals,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 2,
                            pointRadius: 1,
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Y 位置',
                            data: yVals,
                            borderColor: '#22c55e',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            borderWidth: 2,
                            pointRadius: 1,
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Z 位置',
                            data: zVals,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            pointRadius: 1,
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#94a3b8',
                                font: { size: 13 }
                            }
                        },
                        title: {
                            display: true,
                            text: '粒子 ' + particleIdx + ' 位置-时间曲线',
                            color: '#60a5fa',
                            font: { size: 16 }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '时间 (秒)',
                                color: '#94a3b8'
                            },
                            ticks: { color: '#64748b' },
                            grid: { color: 'rgba(100, 116, 139, 0.2)' }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '位置坐标',
                                color: '#94a3b8'
                            },
                            ticks: { color: '#64748b' },
                            grid: { color: 'rgba(100, 116, 139, 0.2)' }
                        }
                    },
                    animation: {
                        duration: 500
                    }
                }
            });
        }
        
        function onParticleClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(particles);
            
            if (intersects.length > 0) {
                selectedParticle = intersects[0].index;
                
                const ix = selectedParticle * 3;
                selectedMarker.position.set(
                    currentPositions[ix],
                    currentPositions[ix + 1],
                    currentPositions[ix + 2]
                );
                selectedMarker.visible = true;
                
                updateVelocityArrow(selectedParticle);
                
                document.getElementById('particle-info').style.display = 'block';
                document.getElementById('particle-id').textContent = selectedParticle;
                document.getElementById('velocity-x').textContent = currentVelocities[selectedParticle * 3].toFixed(3);
                document.getElementById('velocity-y').textContent = currentVelocities[selectedParticle * 3 + 1].toFixed(3);
                document.getElementById('velocity-z').textContent = currentVelocities[selectedParticle * 3 + 2].toFixed(3);
            } else {
                selectedParticle = -1;
                selectedMarker.visible = false;
                velocityArrow.visible = false;
                document.getElementById('particle-info').style.display = 'none';
            }
        }
        
        function updateVelocityArrow(index) {
            const ix = index * 3;
            const px = currentPositions[ix];
            const py = currentPositions[ix + 1];
            const pz = currentPositions[ix + 2];
            const vx = currentVelocities[ix];
            const vy = currentVelocities[ix + 1];
            const vz = currentVelocities[ix + 2];
            
            selectedMarker.position.set(px, py, pz);
            
            const dir = new THREE.Vector3(vx, vy, vz);
            const length = dir.length();
            
            if (length > 0.01) {
                dir.normalize();
                velocityArrow.setDirection(dir);
                velocityArrow.setLength(Math.min(length * 0.8, 3));
                velocityArrow.position.set(px, py, pz);
                velocityArrow.visible = true;
            } else {
                velocityArrow.visible = false;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        document.getElementById('particle-count-slider').addEventListener('input', function() {
            displayCount = parseInt(this.value);
            document.getElementById('particle-count-label').textContent = displayCount;
            computeDisplayIndices();
        });
        
        document.getElementById('apply-force-btn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'apply_force' }));
                const btn = document.getElementById('apply-force-btn');
                btn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
                setTimeout(() => {
                    btn.style.background = 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)';
                }, 300);
            }
        });
        
        document.getElementById('record-btn').addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            }
        });
        
        document.getElementById('view-traj-btn').addEventListener('click', () => {
            openTrajectoryChart();
        });
        
        document.getElementById('close-chart-btn').addEventListener('click', () => {
            document.getElementById('chart-modal').classList.remove('active');
        });
        
        document.getElementById('chart-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('chart-modal')) {
                document.getElementById('chart-modal').classList.remove('active');
            }
        });
        
        document.getElementById('traj-particle-select').addEventListener('change', function() {
            renderChart(parseInt(this.value));
        });
        
        init();
    </script>
</body>
</html>
