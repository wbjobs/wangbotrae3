[package]
name = "protofuzz"
version = "0.1.0"
edition = "2021"
description = "Coverage-guided binary protocol state machine reverse engineering and crash analysis CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
rand_chacha = "0.3"
pcap-parser = "0.14"
etherparse = "0.14"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
petgraph = "0.6"
dot = "0.1"
rayon = "1.8"
crossbeam-channel = "0.5"
memmap2 = "0.9"
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"
goblin = "0.7"
addr2line = "0.21"
object = "0.32"
ctrlc = "3.4"

[[bin]]
name = "fuzz"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
