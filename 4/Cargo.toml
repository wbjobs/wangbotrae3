[package]
name = "video-style-transfer"
version = "0.1.0"
edition = "2021"
description = "Real-time video style transfer CLI tool using WASM and FFmpeg"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
wasmtime = { version = "15.0", features = ["async"] }
wasmtime-wasi = "15.0"
rayon = "1.8"
indicatif = "0.17"
ffmpeg-next = { version = "6.0", features = ["codec", "format", "filter", "resampling", "software-scaling", "image", "static"] }
image = { version = "0.24", features = ["png", "jpeg", "gif"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
num_cpus = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
