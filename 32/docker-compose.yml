version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: logfingerprint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    container_name: logfingerprint-api
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

volumes:
  redis_data:
