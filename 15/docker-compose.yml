version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: voxel-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - voxel-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxel-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - SERVER_PORT=8080
      - AUTO_WIND=true
    depends_on:
      - redis
    networks:
      - voxel-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voxel-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  voxel-network:
    driver: bridge
